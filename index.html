<script>
/*
 * One-time recovery for browsers that are still controlled by an older
 * THE BLOOM service worker. Chrome/Edge can keep an old SW/cache alive longer
 * than expected, so clear the old origin cache before registering the current SW.
 */
(() => {
  const RESET_KEY = 'bloom-cache-migration-v4';
  if (!('serviceWorker' in navigator) || localStorage.getItem(RESET_KEY) === 'done') return;

  localStorage.setItem(RESET_KEY, 'done');
  Promise.all([
    navigator.serviceWorker.getRegistrations()
      .then(regs => Promise.all(regs.map(reg => reg.unregister()))),
    'caches' in window
      ? caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))))
      : Promise.resolve()
  ]).then(() => location.reload()).catch(() => location.reload());
})();
</script>
