<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1913" />
      <stop offset="80%" stop-color="#060907" />
      <stop offset="100%" stop-color="#020302" />
    </radialGradient>
    <linearGradient id="favPetalTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7affb0" />
      <stop offset="50%" stop-color="#2bd977" />
      <stop offset="100%" stop-color="#0d6132" />
    </linearGradient>
    <linearGradient id="favPetalSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#1b4d32" />
    </linearGradient>
    <radialGradient id="favCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#6effa8" />
      <stop offset="80%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#064e26" />
    </radialGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base container with dark border -->
  <rect width="64" height="64" rx="14" fill="url(#favBg)" />
  <rect width="64" height="64" rx="14" fill="none" stroke="#1f3b2a" stroke-width="2" />

  <!-- The Bloom Fungal Emblem -->
  <g transform="translate(32, 32)" filter="url(#favGlow)">
    <!-- Toxic tendril roots -->
    <path d="M 0,0 Q -18,-18 -26,-12" stroke="#14532d" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 0,0 Q 18,-18 26,-12" stroke="#14532d" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 0,0 Q -18,18 -22,24" stroke="#581c87" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 0,0 Q 18,18 22,24" stroke="#581c87" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Blooming Petals (Organic 4-way bio flower) -->
    <!-- North Petal -->
    <path d="M 0,-4 C -10,-12 -12,-22 0,-27 C 12,-22 10,-12 0,-4 Z" fill="url(#favPetalTop)" stroke="#bbf7d0" stroke-width="0.8" />
    
    <!-- South Petal -->
    <path d="M 0,4 C -9,12 -10,22 0,26 C 10,22 9,12 0,4 Z" fill="url(#favPetalTop)" stroke="#86efac" stroke-width="0.6" opacity="0.9" />

    <!-- West Petal (Infected Violet) -->
    <path d="M -4,0 C -12,-10 -22,-9 -26,0 C -22,9 -12,10 -4,0 Z" fill="url(#favPetalSide)" stroke="#d8b4fe" stroke-width="0.6" />

    <!-- East Petal (Infected Violet) -->
    <path d="M 4,0 C 12,-10 22,-9 26,0 C 22,9 12,10 4,0 Z" fill="url(#favPetalSide)" stroke="#d8b4fe" stroke-width="0.6" />

    <!-- Spore Core Bulb -->
    <circle cx="0" cy="0" r="7.5" fill="url(#favCore)" />
    <circle cx="0" cy="0" r="3.2" fill="#ffffff" />

    <!-- Spore specks -->
    <circle cx="-16" cy="-18" r="1.5" fill="#4dffa0" />
    <circle cx="16" cy="-18" r="1.5" fill="#c084fc" />
    <circle cx="-18" cy="14" r="1.2" fill="#4dffa0" />
    <circle cx="18" cy="14" r="1.2" fill="#4dffa0" />
  </g>
</svg>
